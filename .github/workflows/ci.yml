name: Moodle Plugin CI

on: [push, pull_request]

# Read-only by default: nothing in this workflow pushes, tags, or creates a
# release, so GITHUB_TOKEN never needs write access even if a step's own code
# (or a compromised third-party action) is unexpectedly malicious.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04

    # Composer downloads dependency zips from codeload.github.com, which rate-limits
    # anonymous callers hard: a run that lands while the runner's shared IP is busy
    # gets HTTP 429 on a dozen packages at once and the install step dies before a
    # single check runs. Authenticating with the job's own GITHUB_TOKEN lifts the
    # limit. Job-level so it also covers the `composer create-project` above the
    # install step. Read-only token; nothing here writes.
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        moodle-branch: ['MOODLE_500_STABLE']
        database: [pgsql, mariadb]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint ./plugin

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd ./plugin

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0 ./plugin

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0 ./plugin

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate ./plugin

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints ./plugin

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning ./plugin

      # The tag expression must keep the component filter. Passing only
      # "~@local_unifiedgrader_wip" REPLACES moodle-plugin-ci's default
      # "@local_unifiedgrader" rather than narrowing it, which runs the whole of
      # core's suite — 5638 scenarios, most of them failing, because this plugin
      # deliberately takes over the activity grading screens that core's own
      # tests drive.
      #
      # Scenarios tagged @local_unifiedgrader_wip are written against step
      # definitions that do not exist yet (they need fixtures — a PDF
      # submission, an attached marking guide, a seeded orphan submission row).
      # They are excluded rather than deleted so the intent stays recorded.
      # Everything else runs for real: until the guard in
      # tests/behat/behat_local_unifiedgrader.php was removed, loading that
      # context killed the whole behat process silently and this step passed
      # without executing a single scenario.
      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: |
          if [ -d "plugin/tests/behat" ]; then
            moodle-plugin-ci behat --profile chrome --scss-deprecations \
              --tags '@local_unifiedgrader&&~@local_unifiedgrader_wip' ./plugin
          else
            echo "No Behat features found, skipping."
          fi

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
